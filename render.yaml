services:
  - type: web
    name: bifrost-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: PG_HOST
        sync: false
      - key: PG_USER
        sync: false
      - key: PG_PASSWORD
        sync: false
      - key: BIFROST_SETUP_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true
